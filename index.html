<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0e16" />
  <meta name="description" content="Battle tracker for Warriors of Chaos — Warhammer: The Old World. Track Gaze of the Gods, spells and casualties live." />
  <title>ChaosTracker26</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ChaosTracker" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/favicon-32.png" alt="" width="24" height="24" />
      <select id="armySel" class="armysel" title="Switch army" aria-label="Switch army"></select>
      <span id="armyPoints" class="points"></span>
    </div>
    <div class="actions">
      <div class="turnbox" title="Advance the turn — clears spells that last until your next turn / end of turn">
        <button id="btnPrevTurn" class="turnstep" title="Previous turn">−</button>
        <span class="turnlabel">Turn <b id="turnNum">1</b></span>
        <button id="btnNextTurn" class="primary" title="Next turn (clear temporary effects)">Next ▶</button>
      </div>
      <div class="menu">
        <button id="btnMenu" class="iconbtn" aria-haspopup="true" aria-label="Menu" title="Menu">☰</button>
        <div id="menuPanel" class="menupanel" hidden>
          <button id="btnImport">📋 Import list</button>
          <button id="btnScoring">🏆 Scoring</button>
          <div class="menu-sep"></div>
          <button id="btnNewArmy">🆕 New army</button>
          <button id="btnRenameArmy">✎ Rename army</button>
          <button id="btnDelArmy" class="danger">🗑 Delete army</button>
          <div class="menu-sep"></div>
          <button id="btnCollapseAll">↕ Collapse / expand all</button>
          <button id="btnNewBattle">⚔ New battle (reset)</button>
          <button id="btnReset" class="danger">♻ Clear units</button>
          <div class="menu-sep"></div>
          <button id="btnBackup">⬇ Backup to file</button>
          <button id="btnRestore">⬆ Restore from file</button>
          <div class="menu-sep"></div>
          <button id="btnUpdate">⟳ Check for updates</button>
          <button id="btnHelp">❔ How to use</button>
        </div>
      </div>
    </div>
  </header>
  <input id="restoreFile" type="file" accept=".json,application/json" hidden />
  <a id="dlAnchor" hidden></a>

  <nav class="viewtabs" role="tablist">
    <button id="tabRoster" class="viewtab active" role="tab">⚔ Roster</button>
    <button id="tabScoring" class="viewtab" role="tab">🏆 Scoring</button>
  </nav>

  <main id="roster" class="roster"></main>

  <footer class="foot">
    <span class="muted small">Stat lines &amp; the Gaze of the Gods table are editable defaults — verify against your Arcane Journal.</span>
    <span class="verrow">
      <span id="appVer" class="muted small ver"></span>
      <button id="btnChangelog" class="changelogbtn">What's new</button>
    </span>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/data-empire.js"></script>
  <script src="js/data-highelves.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
