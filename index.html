<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0e16" />
  <meta name="description" content="Battle tracker for Warriors of Chaos — Warhammer: The Old World. Track Gaze of the Gods, spells and casualties live." />
  <title>ChaosTracker26</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ChaosTracker" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/favicon-32.png" alt="" width="26" height="26" />
      <div class="brandtext">
        <input id="armyName" class="armyname" placeholder="My Army" aria-label="Army name" />
        <span id="armyPoints" class="points"></span>
      </div>
    </div>
    <div class="actions">
      <button id="btnImport" class="primary">Import list</button>
      <button id="btnAdd">Add unit</button>
      <button id="btnEndTurn" title="Clear spells that last until your next turn">End of turn</button>
      <button id="btnReset" class="ghost danger" title="Clear everything">Reset</button>
    </div>
  </header>

  <main id="roster" class="roster"></main>

  <footer class="foot">
    <span class="muted small">Stat lines &amp; the Gaze of the Gods table are editable defaults — verify against your Arcane Journal.</span>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
