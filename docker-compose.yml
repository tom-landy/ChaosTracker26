# ChaosTracker26 — self-host on Synology Container Manager (or any Docker host).
#
# What it does:
#   • git-sync: clones this public repo into a shared volume and re-pulls every
#     5 minutes, so the site auto-updates whenever new commits are pushed to GitHub.
#   • web: nginx serving those files on port 8080.
#
# Uses a NAMED VOLUME (created automatically) rather than a host folder, so there's
# nothing to pre-create — this avoids the "bind mount ... does not exist" error.
#
# Setup in DSM:
#   1. Container Manager → Project → Create. Name it, pick any folder.
#   2. Source: "Create docker-compose.yml" and paste this file. Run it.
#   3. Control Panel → Login Portal → Advanced → Reverse Proxy → point your
#      hostname at  localhost : 8080  (HTTPS on the front end enables PWA install).
#
# After that it's hands-off: pushes to GitHub appear on your Synology within ~5 min.

services:
  git-sync:
    image: alpine/git:latest
    restart: unless-stopped
    environment:
      REPO: "https://github.com/tom-landy/ChaosTracker26.git"
      SITE_BRANCH: "claude/old-world-army-tracker-ax824t"
      INTERVAL: "300"   # seconds between update checks
    volumes:
      - site:/site
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        cd /site;
        if [ ! -d .git ]; then
          git init -q && (git remote add origin "$$REPO" 2>/dev/null || git remote set-url origin "$$REPO");
        fi;
        while true; do
          if git fetch --depth 1 origin "$$SITE_BRANCH" && git reset --hard FETCH_HEAD && git clean -fdq; then
            echo "synced $$SITE_BRANCH @ $$(git rev-parse --short HEAD)";
          else
            echo "update check failed, will retry";
          fi;
          sleep "$$INTERVAL";
        done

  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - git-sync
    ports:
      - "8080:80"
    volumes:
      - site:/usr/share/nginx/html:ro

volumes:
  site:
